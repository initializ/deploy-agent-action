# Example: build + govern + deploy a STRANDS agent (e.g. DenyABot).
# Drop this in the agent repo as .github/workflows/deploy.yml.
name: deploy-strands-agent
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Surface the platform creds ONCE from org-level secret/vars. The deploy step
    # then needs no token/org/url inputs (it reads these ambient INITIALIZ_*).
    env:
      INITIALIZ_TOKEN: ${{ secrets.INITIALIZ_TOKEN }}          # org secret
      INITIALIZ_ORG_ID: ${{ vars.INITIALIZ_ORG_ID }}           # org variable
      INITIALIZ_WORKSPACE_ID: ${{ vars.INITIALIZ_WORKSPACE_ID }}
      # INITIALIZ_API_URL / INITIALIZ_AUTH_URL default to the test env in the
      # action — set them here only to target a different environment.
    steps:
      - uses: actions/checkout@v4

      # 1) build app image (repo's own Dockerfile) -> wrap with strands governance -> push governed
      - id: gov
        uses: initializ/deploy-agent-action/build-governed-image@v1
        with:
          framework: strands
          image: ghcr.io/${{ github.repository }}
          tag: ${{ github.sha }}
          strands-extra: anthropic            # openai for a Responses-API gateway
          pkg-image: ghcr.io/initializ/strands-pkg:v0.0.2
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # write:packages + read:packages

      # 2) deploy the governed image (type: strands lives in initializ-deploy.yaml).
      # token/org/workspace/urls come from the job env above — nothing to pass here.
      - uses: initializ/deploy-agent-action/deploy@v1
        with:
          image: ${{ steps.gov.outputs.ref }}
          wait: "true"
