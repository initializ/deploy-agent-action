name: Deploy initializ agent
description: >
  Deploy a CI-built forge / claude-agent / strands image to the initializ
  platform via the released `initializ` CLI. The framework is carried by
  `agent.type` in initializ-deploy.yaml — this step is identical for all three.

inputs:
  image:
    description: "Pushed image ref to deploy (repo:tag or repo@sha)"
    required: true
  spec-file:
    description: "Path to initializ-deploy.yaml"
    default: "initializ-deploy.yaml"
  token:
    description: "INITIALIZ_TOKEN — platform access token (the only real secret)"
    required: true
  org-id:
    description: "INITIALIZ_ORG_ID"
    required: true
  workspace-id:
    description: "INITIALIZ_WORKSPACE_ID (or set agent.workspace in the spec)"
    default: ""
  api-url:
    description: "INITIALIZ_API_URL — agent-builder ingress (serves /api/v1/agents/*)"
    required: true
  auth-url:
    description: "INITIALIZ_AUTH_URL — api-next ingress (serves /verify for whoami)"
    required: true
  cli-version:
    description: "initializ CLI release tag, or 'latest'"
    default: "latest"
  wait:
    description: "Poll until the rollout finishes"
    default: "true"
  timeout:
    description: "Max time to wait when wait=true"
    default: "10m"
  tags:
    description: "Newline-separated metadata tags key=value (stamped as agent.initializ.ai/<key>)"
    default: ""

outputs:
  agent-id:
    description: "The deployed agent's id"
    value: ${{ steps.deploy.outputs.agent_id }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        INITIALIZ_TOKEN: ${{ inputs.token }}
        INITIALIZ_ORG_ID: ${{ inputs.org-id }}
        INITIALIZ_WORKSPACE_ID: ${{ inputs.workspace-id }}
        INITIALIZ_API_URL: ${{ inputs.api-url }}
        INITIALIZ_AUTH_URL: ${{ inputs.auth-url }}
        IMAGE: ${{ inputs.image }}
        SPEC_FILE: ${{ inputs.spec-file }}
        CLI_VERSION: ${{ inputs.cli-version }}
        WAIT: ${{ inputs.wait }}
        TIMEOUT: ${{ inputs.timeout }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail

        # Install the released CLI binary (no Go toolchain needed).
        base="https://github.com/initializ/cli/releases"
        if [ "$CLI_VERSION" = "latest" ]; then
          url="$base/latest/download/initializ_linux_amd64.tar.gz"
        else
          url="$base/download/$CLI_VERSION/initializ_linux_amd64.tar.gz"
        fi
        mkdir -p "$RUNNER_TEMP/izbin"
        echo "--- install initializ CLI ($CLI_VERSION)"
        curl -fsSL "$url" | tar xz -C "$RUNNER_TEMP/izbin" initializ
        export PATH="$RUNNER_TEMP/izbin:$PATH"
        initializ version

        # Preflight the token (fails fast on invalid/revoked; exit 3).
        initializ auth whoami

        args=(agent deploy -f "$SPEC_FILE" --image "$IMAGE")
        [ "$WAIT" = "true" ] && args+=(--wait --timeout "$TIMEOUT")
        while IFS= read -r t; do
          [ -n "$t" ] && args+=(--tag "$t")
        done <<< "$TAGS"

        echo "--- deploy $IMAGE"
        out="$(initializ "${args[@]}" 2>&1 | tee /dev/stderr)"
        # Best-effort id capture ("deployed <agent-id> (<tag>)").
        aid="$(printf '%s\n' "$out" | sed -n 's/^deployed \([^ ]*\).*/\1/p' | tail -1)"
        echo "agent_id=$aid" >> "$GITHUB_OUTPUT"
