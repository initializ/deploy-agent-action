name: Deploy initializ agent
description: >
  Deploy a CI-built forge / claude-agent / strands image to the initializ
  platform via the released `initializ` CLI. The framework is carried by
  `agent.type` in initializ-deploy.yaml — this step is identical for all three.
  Config resolves as: explicit input > ambient INITIALIZ_* env > baked default.
  So a caller that exports INITIALIZ_TOKEN/ORG_ID (e.g. from an ORG secret) at the
  job level needs to pass nothing here.

inputs:
  image:
    description: "Pushed image ref to deploy (repo:tag or repo@sha)"
    required: true
  spec-file:
    description: "Path to initializ-deploy.yaml"
    default: "initializ-deploy.yaml"
  token:
    description: "Platform access token. Falls back to $INITIALIZ_TOKEN (set it once as an ORG secret)."
    default: ""
  org-id:
    description: "Org id. Falls back to $INITIALIZ_ORG_ID."
    default: ""
  workspace-id:
    description: "Workspace id. Falls back to $INITIALIZ_WORKSPACE_ID (or agent.workspace in the spec)."
    default: ""
  api-url:
    description: "agent-builder ingress. Falls back to $INITIALIZ_API_URL, then the baked default."
    default: ""
  auth-url:
    description: "api-next ingress (whoami/verify). Falls back to $INITIALIZ_AUTH_URL, then the baked default."
    default: ""
  cli-version:
    description: "initializ CLI release tag, or 'latest'"
    default: "latest"
  wait:
    description: "Poll until the rollout finishes"
    default: "true"
  timeout:
    description: "Max time to wait when wait=true"
    default: "10m"
  tags:
    description: "Newline-separated metadata tags key=value (stamped as agent.initializ.ai/<key>)"
    default: ""

outputs:
  agent-id:
    description: "The deployed agent's id"
    value: ${{ steps.deploy.outputs.agent_id }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        # Inputs come in under INPUT_*; ambient INITIALIZ_* (from the caller's job
        # env / org secret) is read as the fallback. Kept as separate names so an
        # empty input never clobbers a set ambient value.
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ORG: ${{ inputs.org-id }}
        INPUT_WS: ${{ inputs.workspace-id }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_AUTH_URL: ${{ inputs.auth-url }}
        IMAGE: ${{ inputs.image }}
        SPEC_FILE: ${{ inputs.spec-file }}
        CLI_VERSION: ${{ inputs.cli-version }}
        WAIT: ${{ inputs.wait }}
        TIMEOUT: ${{ inputs.timeout }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail

        # Resolve config: explicit input > ambient env > baked default (URLs only).
        TOKEN="${INPUT_TOKEN:-${INITIALIZ_TOKEN:-}}"
        ORG="${INPUT_ORG:-${INITIALIZ_ORG_ID:-}}"
        WS="${INPUT_WS:-${INITIALIZ_WORKSPACE_ID:-}}"
        API_URL="${INPUT_API_URL:-${INITIALIZ_API_URL:-https://agent-builder.test.initializ.ai}}"
        AUTH_URL="${INPUT_AUTH_URL:-${INITIALIZ_AUTH_URL:-https://api-next.test.initializ.ai}}"

        [ -n "$TOKEN" ] || { echo "::error::no platform token — pass 'token' or set the INITIALIZ_TOKEN org secret into the job env"; exit 2; }
        [ -n "$ORG" ]   || { echo "::error::no org id — pass 'org-id' or set INITIALIZ_ORG_ID"; exit 2; }

        # Export the resolved values for the CLI (it reads INITIALIZ_*).
        export INITIALIZ_TOKEN="$TOKEN" INITIALIZ_ORG_ID="$ORG" \
               INITIALIZ_API_URL="$API_URL" INITIALIZ_AUTH_URL="$AUTH_URL"
        [ -n "$WS" ] && export INITIALIZ_WORKSPACE_ID="$WS" || true

        # Install the released CLI binary (no Go toolchain needed).
        base="https://github.com/initializ/cli/releases"
        if [ "$CLI_VERSION" = "latest" ]; then
          url="$base/latest/download/initializ_linux_amd64.tar.gz"
        else
          url="$base/download/$CLI_VERSION/initializ_linux_amd64.tar.gz"
        fi
        mkdir -p "$RUNNER_TEMP/izbin"
        echo "--- install initializ CLI ($CLI_VERSION)"
        curl -fsSL "$url" | tar xz -C "$RUNNER_TEMP/izbin" initializ
        export PATH="$RUNNER_TEMP/izbin:$PATH"
        initializ version

        # Preflight the token (fails fast on invalid/revoked; exit 3).
        initializ auth whoami

        args=(agent deploy -f "$SPEC_FILE" --image "$IMAGE")
        [ "$WAIT" = "true" ] && args+=(--wait --timeout "$TIMEOUT")
        while IFS= read -r t; do
          [ -n "$t" ] && args+=(--tag "$t")
        done <<< "$TAGS"

        echo "--- deploy $IMAGE"
        out="$(initializ "${args[@]}" 2>&1 | tee /dev/stderr)"
        # Best-effort id capture ("deployed <agent-id> (<tag>)").
        aid="$(printf '%s\n' "$out" | sed -n 's/^deployed \([^ ]*\).*/\1/p' | tail -1)"
        echo "agent_id=$aid" >> "$GITHUB_OUTPUT"
